name: Publish H5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble the public H5 site
        run: |
          mkdir -p _site/templates
          node scripts/build-review-h5.cjs
          node --test scripts/build-review-h5.test.cjs
          cp dist/sayelf-qingyubiao-review.html _site/index.html
          cp dist/sayelf-qingyubiao-review.html _site/review.html
          cp dist/sayelf-qingyubiao-review.html _site/templates/山野精灵.晴雨表.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
